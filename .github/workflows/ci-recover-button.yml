name: "CI Recovery: Make It Green"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to recover (default: main)"
        required: false
        default: "main"
      run_maintenance:
        description: "Trigger maintenance workflows first"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger maintenance pulse
        if: inputs.run_maintenance == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ inputs.branch }}';
            const maintenance = ['auto-format.yml', 'type-generation.yml', 'auto-cleanup.yml'];

            console.log(`Maintenance pulse on branch: ${branch}\n`);
            for (const wf of maintenance) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: wf, ref: branch
                });
                console.log(`  OK: ${wf}`);
              } catch (e) {
                console.log(`  SKIP: ${wf}: ${e.message}`);
              }
            }

      - name: Dispatch all workflows and write summary
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ inputs.branch }}';
            const maintenance = '${{ inputs.run_maintenance }}';

            // Workflows that support workflow_dispatch
            const dispatchable = [
              'admin-panel-e2e.yml',
              'bundle-size.yml',
              'changelog.yml',
              'checkly-deploy.yml',
              'ci.yml',
              'coverage-tracking.yml',
              'dast.yml',
              'dead-code.yml',
              'developer-experience.yml',
              'duplication.yml',
              'flutter-builds.yml',
              'license-sbom.yml',
              'lighthouse.yml',
              'production-monitoring.yml',
              'visual-regression.yml',
              'workflow-health.yml'
            ];

            // Non-dispatchable — try rerun if failed
            const rerunOnly = [
              'commit-lint.yml',
              'database.yml',
              'gitleaks.yml',
              'secrets.yml',
              'security.yml',
              'semgrep.yml',
              'staging-migrations.yml',
              'validate.yml'
            ];

            const results = [];

            // Phase 1: Fresh dispatch
            console.log(`Dispatching ${dispatchable.length} workflows on branch: ${branch}\n`);
            for (const wf of dispatchable) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: wf, ref: branch
                });
                console.log(`  DISPATCH: ${wf}`);
                results.push([wf, 'Dispatched']);
              } catch (e) {
                console.log(`  SKIP: ${wf}: ${e.message}`);
                results.push([wf, 'Failed']);
              }
            }

            // Phase 2: Rerun non-dispatchable
            console.log(`\nRerunning ${rerunOnly.length} non-dispatchable workflows\n`);
            const { data: failedRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              branch, status: 'failure', per_page: 100
            });

            for (const wfFile of rerunOnly) {
              const match = failedRuns.workflow_runs.find(r => {
                const rFile = r.path ? r.path.split('/').pop() : '';
                return rFile === wfFile;
              });

              if (match) {
                try {
                  await github.rest.actions.reRunWorkflow({
                    owner: context.repo.owner, repo: context.repo.repo,
                    run_id: match.id
                  });
                  console.log(`  RERUN: ${match.name}`);
                  results.push([match.name, 'Rerun']);
                } catch (e) {
                  console.log(`  SKIP: ${wfFile}: ${e.message}`);
                  results.push([wfFile, 'Failed']);
                }
              } else {
                console.log(`  SKIP: ${wfFile}: no failure found`);
                results.push([wfFile, 'No failure']);
              }
            }

            // Write summary directly — no cross-step JSON passing
            const dispatched = results.filter(r => r[1] === 'Dispatched').length;
            const rerun = results.filter(r => r[1] === 'Rerun').length;
            const failed = results.filter(r => r[1] === 'Failed').length;

            let md = `## CI Recovery Report\n\n`;
            md += `| Field | Value |\n|-------|-------|\n`;
            md += `| Branch | \`${branch}\` |\n`;
            md += `| Maintenance | ${maintenance === 'true' ? 'Triggered' : 'Skipped'} |\n`;
            md += `| Dispatched | **${dispatched}** |\n`;
            md += `| Rerun | **${rerun}** |\n`;
            md += `| Failed | **${failed}** |\n\n`;

            md += `| Workflow | Status |\n|----------|--------|\n`;
            for (const [name, status] of results) {
              md += `| ${name} | ${status} |\n`;
            }

            await core.summary.addRaw(md).write();
            console.log(`\nDone: ${dispatched} dispatched, ${rerun} rerun, ${failed} failed`);
