name: "CI Recovery: Make It Green"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to recover (default: main)"
        required: false
        default: "main"
      run_maintenance:
        description: "Trigger maintenance workflows first"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger maintenance pulse
        if: inputs.run_maintenance == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ inputs.branch }}';
            const maintenance = ['auto-format.yml', 'type-generation.yml', 'auto-cleanup.yml'];

            console.log(`🛠️ Maintenance pulse on branch: ${branch}\n`);
            for (const wf of maintenance) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: wf, ref: branch
                });
                console.log(`  ✅ ${wf}`);
              } catch (e) {
                console.log(`  ⚠️ ${wf}: ${e.message}`);
              }
            }

      - name: Fresh-dispatch all dispatchable workflows
        id: dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ inputs.branch }}';

            // All workflows that support workflow_dispatch (minus self, maintenance, and meta)
            const dispatchable = [
              'admin-panel-e2e.yml',
              'bundle-size.yml',
              'changelog.yml',
              'checkly-deploy.yml',
              'ci.yml',
              'coverage-tracking.yml',
              'dast.yml',
              'dead-code.yml',
              'developer-experience.yml',
              'duplication.yml',
              'flutter-builds.yml',
              'license-sbom.yml',
              'lighthouse.yml',
              'production-monitoring.yml',
              'visual-regression.yml',
              'workflow-health.yml'
            ];

            // Non-dispatchable workflows — try rerun if they failed
            const rerunOnly = [
              'commit-lint.yml',
              'database.yml',
              'gitleaks.yml',
              'secrets.yml',
              'security.yml',
              'semgrep.yml',
              'staging-migrations.yml',
              'validate.yml'
            ];

            console.log(`\n🚀 Dispatching ${dispatchable.length} workflows on branch: ${branch}\n`);

            const results = [];

            // Phase 1: Fresh dispatch
            for (const wf of dispatchable) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: wf, ref: branch
                });
                console.log(`  🟢 Dispatched: ${wf}`);
                results.push({ name: wf, status: '🟢 Dispatched' });
              } catch (e) {
                console.log(`  ⚠️ ${wf}: ${e.message}`);
                results.push({ name: wf, status: `⚠️ ${e.message.substring(0, 60)}` });
              }
            }

            // Phase 2: Rerun latest failure for non-dispatchable workflows
            console.log(`\n🔄 Rerunning ${rerunOnly.length} non-dispatchable workflows\n`);

            const { data: failedRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              branch: branch, status: 'failure', per_page: 100
            });

            for (const wfFile of rerunOnly) {
              // Find the latest failed run for this workflow file
              const wfName = wfFile.replace('.yml', '');
              const match = failedRuns.workflow_runs.find(r => {
                const rFile = r.path ? r.path.split('/').pop() : '';
                return rFile === wfFile;
              });

              if (match) {
                try {
                  await github.rest.actions.reRunWorkflow({
                    owner: context.repo.owner, repo: context.repo.repo,
                    run_id: match.id
                  });
                  console.log(`  🔄 Rerun: ${match.name} (${match.id})`);
                  results.push({ name: match.name, status: '🔄 Rerun' });
                } catch (e) {
                  console.log(`  ⚠️ ${wfFile}: ${e.message}`);
                  results.push({ name: wfFile, status: `⚠️ ${e.message.substring(0, 60)}` });
                }
              } else {
                console.log(`  ⏭️ ${wfFile}: no failed run found`);
                results.push({ name: wfFile, status: '⏭️ No failure found' });
              }
            }

            core.setOutput('total', results.length.toString());
            core.setOutput('results', JSON.stringify(results));

      - name: Write recovery summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ inputs.branch }}';
            const total = '${{ steps.dispatch.outputs.total }}';
            const maintenance = '${{ inputs.run_maintenance }}';

            let results = [];
            try { results = JSON.parse('${{ steps.dispatch.outputs.results }}'); } catch {}

            let summary = `## 🚀 CI Recovery Report\n\n`;
            summary += `| Field | Value |\n|-------|-------|\n`;
            summary += `| Branch | \`${branch}\` |\n`;
            summary += `| Maintenance | ${maintenance === 'true' ? '✅ Triggered' : '⏭️ Skipped'} |\n`;
            summary += `| Workflows Processed | **${total}** |\n\n`;

            if (results.length > 0) {
              const dispatched = results.filter(r => r.status.includes('Dispatched'));
              const rerun = results.filter(r => r.status.includes('Rerun'));
              const failed = results.filter(r => r.status.includes('⚠️'));

              summary += `### Results: ${dispatched.length} dispatched, ${rerun.length} rerun, ${failed.length} issues\n\n`;
              summary += `| Workflow | Method |\n|----------|--------|\n`;
              for (const r of results) {
                summary += `| ${r.name} | ${r.status} |\n`;
              }
              summary += `\n`;
            }

            summary += `---\n`;
            summary += `*[Monitor progress →](https://github.com/${context.repo.owner}/${context.repo.repo}/actions?query=branch%3A${branch})*\n`;

            await core.summary.addRaw(summary).write();
