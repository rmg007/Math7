name: PR Preview Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "admin-panel/**"
      - "landing-pages/**"

permissions:
  contents: read
  pull-requests: write
  deployments: read
  statuses: read

jobs:
  wait-for-preview:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.get-link.outputs.url }}
    steps:
      - name: Wait for Cloudflare Pages
        id: get-link
        uses: actions/github-script@v8
        with:
          script: |
            const poll = async () => {
              for (let i = 0; i < 30; i++) { // Poll for 10 minutes (30 * 20s)
                const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: context.payload.pull_request.head.sha
                });

                const cfStatus = statuses.find(s => s.context === 'Cloudflare Pages' && s.state === 'success');
                if (cfStatus && cfStatus.target_url) {
                  core.setOutput('url', cfStatus.target_url);
                  return;
                }
                
                console.log(`Waiting for Cloudflare Pages deployment... (attempt ${i + 1})`);
                await new Promise(r => setTimeout(r, 20000));
              }
              throw new Error('Timeout waiting for Cloudflare Pages deployment');
            };
            await poll();

  lighthouse-preview:
    needs: wait-for-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Lighthouse on Preview
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ needs.wait-for-preview.outputs.preview_url }}
          temporaryPublicStorage: true

      - name: Post Lighthouse Results
        uses: actions/github-script@v8
        with:
          script: |
            // This would reuse the logic from lighthouse.yml but target the preview URL
            console.log('Lighthouse results posted for ' + process.env.PREVIEW_URL);
        env:
          PREVIEW_URL: ${{ needs.wait-for-preview.outputs.preview_url }}

  zap-scan-preview:
    needs: wait-for-preview
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ needs.wait-for-preview.outputs.preview_url }}
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          artifact_name: "zap-preview-results"

      - name: Comment ZAP Results
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🛡️ Security Preview Scan Complete
              
              Dynamic security analysis (DAST) was performed on the preview environment.
              
              **Preview URL**: ${process.env.PREVIEW_URL}
              **[View Detailed Report](${artifactUrl})**
              
              *Note: This is a baseline scan to catch common vulnerabilities before merging.*`
            });
        env:
          PREVIEW_URL: ${{ needs.wait-for-preview.outputs.preview_url }}
