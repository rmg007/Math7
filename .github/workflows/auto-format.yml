name: Auto Format

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            admin-panel/package-lock.json
            landing-pages/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format Admin Panel
        run: |
          cd admin-panel
          npm ci --legacy-peer-deps
          npm run format || true

      - name: Format Landing Pages
        run: |
          cd landing-pages
          npm ci --legacy-peer-deps
          npm run format || true

      - name: Format Student App
        run: |
          cd student-app
          flutter format .

      - name: Format Python
        run: |
          pip install ruff
          ruff format content-engine/ || true
          ruff format *.py || true

      - name: Format Markdown
        run: |
          npx prettier --write "**/*.md" --ignore-path .gitignore

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎨 Auto-format code [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
