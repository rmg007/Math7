name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs freshness
        run: bash ./scripts/check-docs-freshness.sh

      - name: Link Integrity Check (Lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.md' --exclude 'node_modules'
          fail: true

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: cd student-app && flutter pub get
      - name: Flutter analyze
        run: cd student-app && flutter analyze
      - name: Flutter test with coverage
        run: cd student-app && flutter test --coverage

      - name: Coverage Gate (60% minimum)
        uses: verygoodopensource/very_good_coverage@v2
        with:
          path: "./student-app/coverage/lcov.info"
          min_coverage: 60
      - name: Upload Flutter coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: student-app/coverage/lcov.info

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./student-app/coverage/lcov.info

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r content-engine/requirements.txt
          pip install pytest coverage ruff
      - name: Lint with ruff
        run: |
          . .venv/bin/activate
          ruff check content-engine/ *.py --output-format=github
          ruff format --check content-engine/ *.py
      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          cd content-engine
          coverage run -m pytest -q
          coverage report --fail-under=80
      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: content-engine/.coverage

  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit on content-engine
        run: bandit -r content-engine/ -f json -o bandit-content-engine.json || true

      - name: Run Bandit on root scripts
        run: bandit -r *.py -f json -o bandit-root.json || true

      - name: Check for high severity issues
        run: |
          if [ -f bandit-content-engine.json ]; then
            HIGH_SEVER=$(jq '[.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")] | length' bandit-content-engine.json)
            if [ "$HIGH_SEVER" -gt 0 ]; then
              echo "❌ Found $HIGH_SEVER high/critical severity issues in content-engine"
              jq '.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")' bandit-content-engine.json
              exit 1
            fi
          fi

          if [ -f bandit-root.json ]; then
            HIGH_ROOT=$(jq '[.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")] | length' bandit-root.json)
            if [ "$HIGH_ROOT" -gt 0 ]; then
              echo "❌ Found $HIGH_ROOT high/critical severity issues in root scripts"
              jq '.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")' bandit-root.json
              exit 1
            fi
          fi

          echo "✅ No high/critical severity security issues found"

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            bandit-content-engine.json
            bandit-root.json

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            admin-panel/package-lock.json
            package-lock.json
      - name: Install root deps (depcruise)
        run: npm ci --legacy-peer-deps --legacy-peer-deps
      - name: Install admin deps
        run: cd admin-panel && npm ci --legacy-peer-deps --legacy-peer-deps
      - name: Lint
        run: cd admin-panel && npm run lint
      - name: Service role leakage guard
        run: |
          set -e
          if grep -R -nE 'SUPABASE_SERVICE_ROLE_KEY|service_role' admin-panel/src --exclude='lib/env.ts'; then
            echo "Forbidden service_role reference detected in client source";
            exit 1;
          else
            echo "No forbidden service_role references in client source";
          fi
      - name: Dependency validation
        run: npm run deps:validate
      - name: Generate dependency reports
        run: npm run deps:graph && npm run deps:archi && npm run deps:report
      - name: Upload dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graphs
          path: |
            dependency-graph.dot
            architecture-graph.dot
            dependency-report.html
      - name: Architecture Tests
        run: cd admin-panel && npm run test:arch
      - name: Test
        run: cd admin-panel && npm run test -- --coverage
      - name: Cross-browser E2E (Chromium, Firefox, WebKit)
        run: |
          cd admin-panel
          npx playwright install chromium firefox webkit
          npx playwright test --project=chromium --project=firefox --project=webkit
      - name: Coverage Gate (70% minimum)
        uses: verygoodopensource/very_good_coverage@v2
        with:
          path: "./admin-panel/coverage/lcov.info"
          min_coverage: 70
      - name: Build
        run: cd admin-panel && npm run build
      - name: Supabase typegen guard
        run: |
          if [ -f admin-panel/src/lib/database.types.ts ] && [ ! -s admin-panel/src/lib/database.types.ts ]; then echo "database.types.ts is empty"; exit 1; fi
          if [ -f admin-panel/src/types/database.types.ts ] && [ ! -s admin-panel/src/types/database.types.ts ]; then echo "database.types.ts is empty"; exit 1; fi
          cd admin-panel && npm run -s typecheck
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./admin-panel/coverage/lcov.info
      - name: Accessibility Audit (Pa11y)
        run: |
          cd admin-panel
          npm run preview &
          npx wait-on http://localhost:4173
          npx pa11y http://localhost:4173 --standard WCAG2AA || echo "Accessibility issues detected"

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run edge function tests
        run: |
          cd supabase/functions
          deno test --allow-net --allow-env --allow-read --allow-write run-tests.ts
      - name: Upload edge function test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-function-test-results
          path: supabase/functions/test-results/

  destructive-migration-gate:
    name: Destructive Migration Gate (REL-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for destructive SQL operations
        run: |
          set -e
          MIGRATIONS_DIR="supabase/migrations"
          BYPASS_COMMENT="-- allow-destructive"

          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "No migrations directory found, skipping."
            exit 0
          fi

          VIOLATIONS=0
          while IFS= read -r -d '' file; do
            # Skip if file explicitly opts out
            if grep -q "$BYPASS_COMMENT" "$file"; then
              echo "⚠️  Bypassed: $file (contains $BYPASS_COMMENT)"
              continue
            fi

            if grep -qiE '^\s*(DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE\s+TABLE|ALTER\s+TABLE\s+\S+\s+DROP)' "$file"; then
              echo "❌ Destructive operation found in: $file"
              grep -inE '^\s*(DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE\s+TABLE|ALTER\s+TABLE\s+\S+\s+DROP)' "$file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(find "$MIGRATIONS_DIR" -name "*.sql" -print0)

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "❌ $VIOLATIONS migration(s) contain destructive operations."
            echo "   To override, add '-- allow-destructive' as the first line of the migration."
            exit 1
          fi

          echo "✅ No unapproved destructive migrations found."

  supabase-regression-tests:
    name: Security Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Regression Tests
        run: |
          cd supabase
          chmod +x tests/run_all.sh
          ./tests/run_all.sh
        env:
          DATABASE_URL: postgresql://postgres.${{ secrets.TEST_SUPABASE_PROJECT_ID }}:${{ secrets.TEST_DB_PASSWORD }}@aws-0-us-west-1.pooler.supabase.com:6543/postgres

  oracle-plus-validation:
    name: Spec Drift Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Oracle Plus CLI
        run: |
          cd tools/oracle-plus
          npm install --legacy-peer-deps --legacy-peer-deps
          npm run build
          npm link

      - name: Run Drift Analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          oracle-plus check --all --format github > drift-report.md

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Fail if Critical Drift
        run: |
          if grep -q "severity: critical" drift-report.md; then
            echo "❌ Critical spec violations found!"
            exit 1
          fi
