name: Semgrep Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  semgrep:
    name: Semgrep Custom Rules
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Run Questerix-specific custom rules
      - name: Run Custom Rules
        run: semgrep scan --config .semgrep/ --error --verbose

      # Run community security rulesets
      - name: Run Security Rulesets
        run: |
          semgrep scan \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/react" \
            --config "p/secrets" \
            --error \
            --verbose
