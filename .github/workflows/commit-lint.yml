name: Commit Message Validation

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Conventional Commits pattern
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .{1,100}/;

            const invalidCommits = [];
            const validTypes = ['feat', 'fix', 'docs', 'style', 'refactor', 'perf', 'test', 'build', 'ci', 'chore', 'revert'];

            for (const commit of commits) {
              const message = commit.commit.message.split('\n')[0]; // First line only
              
              // Skip merge commits and automated commits
              if (message.startsWith('Merge') || message.includes('[skip ci]')) {
                continue;
              }
              
              if (!pattern.test(message)) {
                invalidCommits.push({
                  sha: commit.sha.substring(0, 7),
                  message: message
                });
              }
            }

            if (invalidCommits.length > 0) {
              let comment = '## ❌ Commit Message Validation Failed\n\n';
              comment += 'The following commits do not follow the [Conventional Commits](https://www.conventionalcommits.org/) format:\n\n';
              
              invalidCommits.forEach(c => {
                comment += `- \`${c.sha}\`: ${c.message}\n`;
              });
              
              comment += '\n**Expected format**:\n';
              comment += '```\n';
              comment += '<type>(<scope>): <description>\n\n';
              comment += 'Examples:\n';
              comment += 'feat(admin): add bulk user import\n';
              comment += 'fix(auth): resolve login redirect issue\n';
              comment += 'docs: update API documentation\n';
              comment += '```\n\n';
              comment += '**Valid types**: ' + validTypes.join(', ') + '\n\n';
              comment += '**To fix**: Use `git rebase -i` to edit commit messages, or add a single well-formatted commit message when squashing.';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              
              core.setFailed('Invalid commit messages found');
            } else {
              console.log('✅ All commit messages are valid');
            }
