name: Auto Cleanup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  cleanup-stale-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Delete stale branches
        uses: actions/github-script@v7
        with:
          script: |
            const daysBeforeStale = 30;
            const exemptBranches = ['main', 'develop', 'staging'];
            const daysBeforeDeleteAfterMerge = 7;

            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const branch of branches) {
              if (exemptBranches.includes(branch.name)) continue;
              
              const { data: commits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: branch.name,
                per_page: 1
              });
              
              if (commits.length === 0) continue;
              
              const lastCommitDate = new Date(commits[0].commit.author.date);
              const daysSinceLastCommit = Math.floor((Date.now() - lastCommitDate) / (1000 * 60 * 60 * 24));
              
              if (daysSinceLastCommit > daysBeforeStale) {
                console.log(`Deleting stale branch: ${branch.name} (${daysSinceLastCommit} days old)`);
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branch.name}`
                  });
                } catch (error) {
                  console.log(`Failed to delete ${branch.name}: ${error.message}`);
                }
              }
            }

  cleanup-stale-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Issues
          stale-issue-message: "⚠️ This issue has been inactive for 60 days and will be closed in 7 days unless there is activity."
          close-issue-message: "🔒 Closed due to inactivity. Please reopen if this is still relevant."
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: "stale"
          exempt-issue-labels: "priority:critical,incident,keep-open"
          # PRs
          stale-pr-message: "⚠️ This PR has been inactive for 30 days and will be closed in 7 days unless there is activity."
          close-pr-message: "🔒 Closed due to inactivity. Please reopen when ready to continue."
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          exempt-pr-labels: "priority:critical,work-in-progress,keep-open"
