name: Flutter Builds (CI)

on:
  pull_request:
    paths:
      - "student-app/**"
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get dependencies
        run: cd student-app && flutter pub get

      - name: Build APK
        run: |
          cd student-app
          flutter build apk --debug # Use release build when keys are configured

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: questerix-android-debug
          path: student-app/build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS (Check)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get dependencies
        run: cd student-app && flutter pub get

      - name: Build iOS (No codesign)
        run: |
          cd student-app
          flutter build ios --debug --no-codesign

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: questerix-ios-debug
          path: student-app/build/ios/iphoneos/Runner.app
