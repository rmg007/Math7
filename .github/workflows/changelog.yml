name: Changelog & Release Management

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Draft Release Notes
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semantic-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'changelog')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const prTitle = context.payload.pull_request.title;
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            const date = new Date().toISOString().split('T')[0];

            // Determine the type of change
            let category = '### Changed';
            if (prTitle.toLowerCase().startsWith('feat')) category = '### Added';
            if (prTitle.toLowerCase().startsWith('fix')) category = '### Fixed';
            if (prTitle.toLowerCase().includes('break')) category = '### Breaking Changes';
            if (prTitle.toLowerCase().startsWith('perf')) category = '### Performance';
            if (prTitle.toLowerCase().startsWith('security')) category = '### Security';

            const changelogEntry = `- ${prTitle} (#${prNumber}) by @${author}`;

            let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            // Find the Unreleased section or create it
            if (!changelog.includes('## [Unreleased]')) {
              changelog = `# Changelog\n\n## [Unreleased]\n\n${category}\n${changelogEntry}\n\n` + changelog;
            } else {
              // Insert into existing Unreleased section
              const lines = changelog.split('\n');
              let inserted = false;
              for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes(category)) {
                  lines.splice(i + 1, 0, changelogEntry);
                  inserted = true;
                  break;
                }
                if (lines[i] === '## [Unreleased]') {
                  lines.splice(i + 1, 0, '', category, changelogEntry);
                  inserted = true;
                  break;
                }
              }
              changelog = lines.join('\n');
            }

            fs.writeFileSync('CHANGELOG.md', changelog);

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📝 Update CHANGELOG.md [skip ci]"
          file_pattern: CHANGELOG.md
