name: CI Repair Dispatch

on:
  workflow_run:
    workflows: ["CI", "Admin Panel E2E Tests"]
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  create-repair-issue:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Check for existing repair issue
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = context.payload.workflow_run.name;
            const label = 'ci-repair';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open'
            });

            // Deduplicate: don't create if an open issue for the same workflow exists
            const existing = issues.data.find(i => i.title.includes(workflowName));
            if (existing) {
              console.log(`Existing repair issue #${existing.number} found. Updating instead.`);
              core.setOutput('existing_issue', existing.number);
              core.setOutput('should_create', 'false');
            } else {
              core.setOutput('should_create', 'true');
            }

      - name: Fetch failure logs
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            // Get jobs for this run
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id
            });

            let failedSteps = [];
            let failedJobName = 'unknown';
            let logSnippet = '';

            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                failedJobName = job.name;
                
                for (const step of job.steps) {
                  if (step.conclusion === 'failure') {
                    failedSteps.push(step.name);
                  }
                }

                // Try to get logs for the failed job
                try {
                  const logData = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id
                  });
                  
                  // Get last 80 lines of the log
                  const fullLog = logData.data;
                  const lines = fullLog.split('\n');
                  logSnippet = lines.slice(-80).join('\n');
                } catch (e) {
                  logSnippet = 'Could not retrieve logs: ' + e.message;
                }
                
                break; // Only process the first failed job
              }
            }

            core.setOutput('failed_job', failedJobName);
            core.setOutput('failed_steps', failedSteps.join(', '));
            core.setOutput('log_snippet', logSnippet.substring(0, 3000)); // GitHub has limits

      - name: Create repair issue
        if: steps.check.outputs.should_create == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const failedJob = '${{ steps.logs.outputs.failed_job }}';
            const failedSteps = '${{ steps.logs.outputs.failed_steps }}';
            const logSnippet = `${{ steps.logs.outputs.log_snippet }}`;

            const body = `## 🔧 CI Repair Request

            **Workflow**: ${run.name}
            **Job**: ${failedJob}
            **Failed Step(s)**: ${failedSteps}
            **Commit**: ${run.head_sha.substring(0, 7)}
            **Branch**: ${run.head_branch}
            **Run URL**: ${run.html_url}
            **Attempts**: 1/2

            ### Failure Log (last 80 lines)
            \`\`\`
            ${logSnippet}
            \`\`\`

            ---
            *Auto-generated by ci-repair-dispatch. The AI agent will pick this up on next session.*
            *If the agent fails to fix this after 2 attempts, this issue will be labeled \`needs-human\`.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[REPAIR] CI Failure: ${run.name} — ${failedSteps || failedJob}`,
              body: body,
              labels: ['ci-repair', 'automated', 'priority:high']
            });

      - name: Update existing repair issue
        if: steps.check.outputs.should_create == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const issueNumber = parseInt('${{ steps.check.outputs.existing_issue }}');
            const failedJob = '${{ steps.logs.outputs.failed_job }}';
            const failedSteps = '${{ steps.logs.outputs.failed_steps }}';
            const logSnippet = `${{ steps.logs.outputs.log_snippet }}`;

            // Check attempt count from issue body
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const attemptMatch = issue.data.body.match(/\*\*Attempts\*\*: (\d+)\/2/);
            const currentAttempts = attemptMatch ? parseInt(attemptMatch[1]) : 1;

            if (currentAttempts >= 2) {
              // Escalate to human
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-human']
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## ⛔ Escalated to Human\n\nThis failure has persisted after 2 repair attempts. Manual intervention required.\n\n**Latest Run**: ${run.html_url}`
              });
            } else {
              // Update with new failure data
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## 🔄 Still Failing (Attempt ${currentAttempts + 1}/2)\n\n**Commit**: ${run.head_sha.substring(0, 7)}\n**Run URL**: ${run.html_url}\n\n### Latest Log\n\`\`\`\n${logSnippet}\n\`\`\``
              });
            }
