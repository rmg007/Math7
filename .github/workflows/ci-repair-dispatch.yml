name: CI Repair Dispatch

on:
  workflow_run:
    workflows:
      - "Admin Panel E2E Tests"
      - "AI PR Agent Reviewer"
      - "Auto Cleanup"
      - "Auto Format"
      - "Auto Label PRs"
      - "Bundle Size Monitoring"
      - "Changelog & Release Management"
      - "Checkly Autonomous Monitoring"
      - "CI"
      - "Code Duplication Detection"
      - "Commit Message Validation"
      - "Coverage Tracking"
      - "DAST Security Scanning"
      - "Database Safety"
      - "Dead Code Detection"
      - "Developer Experience"
      - "Flutter Builds (CI)"
      - "Gitleaks Secret Scan"
      - "License & SBOM Management"
      - "Lighthouse CI"
      - "Platform Health Report"
      - "PR Preview Testing"
      - "Production Monitoring"
      - "Project Oracle Indexer"
      - "Reindex Documentation (Manual)"
      - "Scan with dart-analyze"
      - "Screenshot Diffing"
      - "Secret Scanning"
      - "Security Governance"
      - "Semgrep Static Analysis"
      - "Staging Database Migrations"
      - "Type Generation"
      - "Validation"
      - "Visual Regression Testing"
      - "Workflow Health Check"
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  # ─── JOB 1: Handle failures → create/update repair issues ───
  create-repair-issue:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Fetch failure logs and generate signature
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const run = context.payload.workflow_run;

            // Get jobs for this run
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id
            });

            let failedSteps = [];
            let failedJobName = 'unknown';
            let logSnippet = '';
            let errorLines = '';

            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                failedJobName = job.name;

                for (const step of job.steps) {
                  if (step.conclusion === 'failure') {
                    failedSteps.push(step.name);
                  }
                }

                // Try to get logs for the failed job
                try {
                  const logData = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id
                  });

                  const fullLog = typeof logData.data === 'string' ? logData.data : '';
                  const lines = fullLog.split('\n');

                  // Last 80 lines for display
                  logSnippet = lines.slice(-80).join('\n');

                  // Extract error-pattern lines for signature (ChatGPT Step 3B)
                  const errorPattern = /Error:|ERROR|FATAL|failed|exit code|Traceback|AssertionError|Unhandled|panic:|Cannot find|Module not found|TypeError|ReferenceError|SyntaxError/i;
                  const errorMatches = lines
                    .filter(l => errorPattern.test(l))
                    // Strip timestamps and ANSI codes to normalize
                    .map(l => l.replace(/\d{4}-\d{2}-\d{2}T[\d:.]+Z/g, '').replace(/\x1b\[[0-9;]*m/g, '').trim())
                    .slice(-50);

                  errorLines = errorMatches.join('\n');
                } catch (e) {
                  logSnippet = 'Could not retrieve logs: ' + e.message;
                  errorLines = `log-fetch-failed:${e.message}`;
                }

                break; // Only process the first failed job
              }
            }

            // Generate signature hash (ChatGPT Step 4)
            // If we got error lines, hash those. Otherwise hash workflow+job+steps as fallback.
            const signatureInput = errorLines.length > 10
              ? errorLines
              : `${run.name}::${failedJobName}::${failedSteps.join(',')}`;

            const fullHash = crypto.createHash('sha256').update(signatureInput).digest('hex');
            const shortHash = fullHash.substring(0, 8);

            console.log(`Signature input length: ${signatureInput.length}`);
            console.log(`Signature hash: ${shortHash} (full: ${fullHash})`);

            core.setOutput('failed_job', failedJobName);
            core.setOutput('failed_steps', failedSteps.join(', '));
            core.setOutput('log_snippet', logSnippet.substring(0, 3000));
            core.setOutput('signature', shortHash);
            core.setOutput('full_hash', fullHash);

      - name: Check for existing issue by signature
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const signature = '${{ steps.logs.outputs.signature }}';
            const label = 'ci-repair';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 100
            });

            // Deduplicate by SIGNATURE HASH instead of workflow name
            const existing = issues.data.find(i => i.title.includes(signature));
            if (existing) {
              console.log(`Existing repair issue #${existing.number} found (signature: ${signature}). Updating.`);
              core.setOutput('existing_issue', existing.number);
              core.setOutput('should_create', 'false');
            } else {
              console.log(`No existing issue for signature ${signature}. Creating new.`);
              core.setOutput('should_create', 'true');
            }

      - name: Create repair issue
        if: steps.check.outputs.should_create == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const failedJob = '${{ steps.logs.outputs.failed_job }}';
            const failedSteps = '${{ steps.logs.outputs.failed_steps }}';
            const signature = '${{ steps.logs.outputs.signature }}';
            const fullHash = '${{ steps.logs.outputs.full_hash }}';
            const logSnippet = `${{ steps.logs.outputs.log_snippet }}`;

            const body = `## 🔧 CI Repair Request

            **Workflow**: ${run.name}
            **Job**: ${failedJob}
            **Failed Step(s)**: ${failedSteps}
            **Commit**: ${run.head_sha.substring(0, 7)}
            **Branch**: ${run.head_branch}
            **Run URL**: ${run.html_url}
            **Signature**: \`${signature}\` (full: \`${fullHash}\`)
            **Attempts**: 1/3

            ### Failure Log (last 80 lines)
            \`\`\`
            ${logSnippet}
            \`\`\`

            ---
            *Auto-generated by CI Repair Dispatch (signature-based deduplication).*
            *The AI agent will pick this up on next session.*
            *Escalated to \`needs-human\` after 3 failed repair attempts.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[REPAIR] ${run.name}: ${failedSteps || failedJob} [${signature}]`,
              body: body,
              labels: ['ci-repair', 'automated', 'priority:high']
            });

      - name: Update existing repair issue
        if: steps.check.outputs.should_create == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const issueNumber = parseInt('${{ steps.check.outputs.existing_issue }}');
            const failedSteps = '${{ steps.logs.outputs.failed_steps }}';
            const logSnippet = `${{ steps.logs.outputs.log_snippet }}`;

            // Check attempt count from issue body
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const attemptMatch = issue.data.body.match(/\*\*Attempts\*\*: (\d+)\/3/);
            const currentAttempts = attemptMatch ? parseInt(attemptMatch[1]) : 1;

            if (currentAttempts >= 3) {
              // Escalate to human
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-human']
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## ⛔ Escalated to Human\n\nThis failure has persisted after 3 repair attempts. Manual intervention required.\n\n**Latest Run**: ${run.html_url}`
              });
            } else {
              // Update with new failure data
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## 🔄 Still Failing (Attempt ${currentAttempts + 1}/3)\n\n**Commit**: ${run.head_sha.substring(0, 7)}\n**Branch**: ${run.head_branch}\n**Run URL**: ${run.html_url}\n\n### Latest Log\n\`\`\`\n${logSnippet}\n\`\`\``
              });
            }

  # ─── JOB 2: Handle successes → auto-close resolved repair issues ───
  auto-close-resolved:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Close resolved repair issues
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflowName = run.name;
            const label = 'ci-repair';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 100
            });

            // Find issues whose title contains this workflow name
            const matchingIssues = issues.data.filter(i => i.title.includes(workflowName));

            for (const issue of matchingIssues) {
              console.log(`Closing resolved issue #${issue.number}: ${issue.title}`);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## ✅ Resolved\n\nThe **${workflowName}** workflow has passed successfully.\n\n**Commit**: ${run.head_sha.substring(0, 7)}\n**Branch**: ${run.head_branch}\n**Run URL**: ${run.html_url}\n\n*Auto-closed by CI Repair Dispatch.*`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
