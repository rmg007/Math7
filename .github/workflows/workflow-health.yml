name: Workflow Health Check

on:
  schedule:
    - cron: "0 7 * * 1" # Weekly on Monday at 7 AM
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  analyze-workflow-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow run times
        uses: actions/github-script@v8
        with:
          script: |
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            let report = '## ⚙️ Workflow Health Report\n\n';
            report += `**Analysis Date**: ${new Date().toISOString().split('T')[0]}\n\n`;
            report += '| Workflow | Avg Duration | Status | Issues |\n';
            report += '|----------|--------------|--------|--------|\n';

            let hasSlowWorkflows = false;
            const slowThresholdMinutes = 10;

            for (const workflow of workflows.workflows) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 20,
                status: 'completed'
              });
              
              if (runs.workflow_runs.length === 0) continue;
              
              // Calculate average duration
              const durations = runs.workflow_runs.map(run => {
                const start = new Date(run.created_at);
                const end = new Date(run.updated_at);
                return (end - start) / 1000 / 60; // minutes
              });
              
              const avgDuration = durations.reduce((a, b) => a + b, 0) / durations.length;
              const recentSuccessRate = runs.workflow_runs.filter(r => r.conclusion === 'success').length / runs.workflow_runs.length * 100;
              
              let status = '✅';
              let issues = [];
              
              if (avgDuration > slowThresholdMinutes) {
                status = '⚠️';
                issues.push(`Slow (${avgDuration.toFixed(1)}m)`);
                hasSlowWorkflows = true;
              }
              
              if (recentSuccessRate < 80) {
                status = '❌';
                issues.push(`Low success rate (${recentSuccessRate.toFixed(0)}%)`);
              }
              
              report += `| ${workflow.name} | ${avgDuration.toFixed(1)}m | ${status} | ${issues.join(', ') || '—'} |\n`;
            }

            report += '\n**Thresholds**:\n';
            report += `- Duration: ${slowThresholdMinutes} minutes\n`;
            report += '- Success rate: 80%\n\n';

            if (hasSlowWorkflows) {
              report += '### 🐌 Slow Workflows Detected\n\n';
              report += '**Optimization suggestions**:\n';
              report += '- Cache dependencies (npm, pip, Flutter)\n';
              report += '- Parallelize independent jobs\n';
              report += '- Use matrix strategies for multiple test runs\n';
              report += '- Consider self-hosted runners for faster network\n';
            }

            // Create or update issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'workflow-health,automated',
              state: 'open'
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: report
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚙️ Weekly Workflow Health Report',
                body: report,
                labels: ['workflow-health', 'automated', 'ci']
              });
            }

  check-action-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find outdated GitHub Actions
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const workflowsDir = '.github/workflows';
            const files = fs.readdirSync(workflowsDir);

            let outdatedActions = new Map();

            for (const file of files) {
              if (!file.endsWith('.yml') && !file.endsWith('.yaml')) continue;
              
              const content = fs.readFileSync(path.join(workflowsDir, file), 'utf8');
              
              // Find actions without pinned versions (using @main, @master, or no version)
              const actionPattern = /uses:\s+([^@\s]+)@(main|master|latest|v?\d+)$/gm;
              let match;
              
              while ((match = actionPattern.exec(content)) !== null) {
                const [fullMatch, action, version] = match;
                if (version === 'main' || version === 'master' || version === 'latest') {
                  if (!outdatedActions.has(action)) {
                    outdatedActions.set(action, []);
                  }
                  outdatedActions.get(action).push({ file, version });
                }
              }
            }

            if (outdatedActions.size > 0) {
              let report = '## ⚠️ Unpinned GitHub Actions\n\n';
              report += 'The following actions are not pinned to specific versions:\n\n';
              
              for (const [action, occurrences] of outdatedActions) {
                report += `- **${action}**\n`;
                occurrences.forEach(occ => {
                  report += `  - ${occ.file} (using @${occ.version})\n`;
                });
              }
              
              report += '\n**Recommendation**: Pin actions to specific versions for reproducibility and security.\n';
              report += '```yaml\n';
              report += '# ❌ Unpinned:\n';
              report += 'uses: actions/checkout@main\n\n';
              report += '# ✅ Pinned:\n';
              report += 'uses: actions/checkout@v4\n';
              report += '```';
              
              console.log(report);
            } else {
              console.log('✅ All GitHub Actions are properly pinned');
            }
