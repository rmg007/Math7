name: License & SBOM Management

on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pubspec.yaml"
      - "**/requirements.txt"
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
  schedule:
    - cron: "0 6 * * 0" # Weekly on Sunday at 6 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-license-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install license checker
        run: npm install -g license-checker

      - name: Generate Admin Panel licenses
        run: |
          cd admin-panel
          npm ci --legacy-peer-deps
          license-checker --json > ../licenses-admin.json
          license-checker --summary > ../LICENSES-ADMIN.md

      - name: Generate Landing Pages licenses
        run: |
          cd landing-pages
          npm ci --legacy-peer-deps
          license-checker --json > ../licenses-landing.json
          license-checker --summary > ../LICENSES-LANDING.md

      - name: Generate Python licenses
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r content-engine/requirements.txt
          pip install pip-licenses
          pip-licenses --format=markdown --output-file=LICENSES-PYTHON.md

      - name: Check for problematic licenses
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const blockedLicenses = ['GPL-3.0', 'AGPL-3.0', 'LGPL-3.0'];
            const allowedLicenses = ['MIT', 'Apache-2.0', 'BSD', 'ISC', 'Unlicense'];
            const adminLicenses = JSON.parse(fs.readFileSync('licenses-admin.json', 'utf8'));

            let violations = [];

            for (const [pkg, info] of Object.entries(adminLicenses)) {
              const license = info.licenses;
              
              // Handle dual licenses (e.g., "MIT OR GPL-3.0-or-later")
              if (license.includes(' OR ')) {
                const licenseOptions = license.split(' OR ').map(l => l.trim());
                // If any option is allowed, it's fine
                if (licenseOptions.some(opt => allowedLicenses.some(allowed => opt.includes(allowed)))) {
                  continue;
                }
                // If any option is blocked, it's a violation
                if (licenseOptions.some(opt => blockedLicenses.some(blocked => opt.includes(blocked)))) {
                  violations.push({ package: pkg, license });
                }
              } else if (blockedLicenses.some(blocked => license.includes(blocked))) {
                violations.push({ package: pkg, license });
              }
            }

            if (violations.length > 0) {
              let report = '## ⚠️ License Compliance Violations\n\n';
              report += 'The following packages use licenses that may be incompatible with this project:\n\n';
              
              violations.forEach(v => {
                report += `- **${v.package}**: ${v.license}\n`;
              });
              
              if (context.eventName === 'pull_request') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: report
                });
              }
              
              core.setFailed('License compliance violations detected');
            }

      - name: Create PR for license reports
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📄 Update license reports [skip ci]"
          title: "📄 Automated License Report Update"
          body: |
            This PR updates the license report files.

            - Generated by: license-checker
            - Triggered by: ${{ github.event_name }}
            - Commit: ${{ github.sha }}
          branch: license-update
          delete-branch: true

  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: ./
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Upload SBOM to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Create PR for SBOM update
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📦 Update Software Bill of Materials [skip ci]"
          title: "📦 Automated SBOM Update"
          body: |
            This PR updates the Software Bill of Materials (SBOM) file.

            - Generated by: Syft
            - Triggered by: ${{ github.event_name }}
            - Commit: ${{ github.sha }}
          branch: sbom-update
          delete-branch: true
