name: Developer Experience

on:
  pull_request:
    types: [opened, reopened]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome-first-time:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 **Welcome to Questerix!**

            Thank you for your first pull request! Here's what happens next:

            1. **Automated Checks**: CI will run tests, linting, and security scans
            2. **Review Process**: A maintainer will review your code
            3. **Feedback**: We'll provide constructive feedback if needed

            **Quick Tips:**
            - Check out [AGENTS.md](https://github.com/${{ github.repository }}/blob/main/AGENTS.md) for our coding standards
            - Run `npm run lint:fix` locally before pushing
            - Make sure all tests pass: `npm test`

            Need help? Feel free to ask questions in the comments!
          issue-message: |
            👋 **Thanks for opening your first issue!**

            We appreciate your contribution to Questerix. A maintainer will look at this soon.

            **Before we start:**
            - Have you checked our [documentation](https://github.com/${{ github.repository }}/tree/main/docs)?
            - Is this a bug report? Please include steps to reproduce
            - Is this a feature request? Please describe the use case

            We'll get back to you as soon as possible!

  auto-assign-reviewers:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Auto-assign based on files changed
        uses: actions/github-script@v8
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let reviewers = new Set();

            // Map file paths to reviewers
            const reviewerMap = {
              'admin-panel': ['frontend-team'],
              'student-app': ['mobile-team'],
              'content-engine': ['backend-team'],
              'supabase': ['database-team'],
              '.github/workflows': ['devops-team']
            };

            files.forEach(file => {
              for (const [path, team] of Object.entries(reviewerMap)) {
                if (file.filename.includes(path)) {
                  team.forEach(r => reviewers.add(r));
                }
              }
            });

            if (reviewers.size > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: Array.from(reviewers).filter(r => r !== context.actor)
              });
            }

  spell-check-docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: |
            **/*.md
            docs/**/*
          config: .cspell.json
          incremental_files_only: true

  pr-size-warning:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR size
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;

            if (totalChanges > 1000) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ⚠️ Large PR Warning
                
                This PR has **${totalChanges}** lines changed. Large PRs are harder to review and more likely to introduce bugs.
                
                **Consider:**
                - Breaking this into smaller, focused PRs
                - Separating refactoring from feature changes
                - Using feature flags for incremental rollout
                
                **Current stats:**
                - Additions: ${additions}
                - Deletions: ${deletions}
                - Total: ${totalChanges}`
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['size/xl', 'needs-splitting']
              });
            }
