name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-phases-0-3:
    runs-on: ubuntu-latest
    env:
      STRICT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge rate limiter (Deno)
        working-directory: supabase/functions
        run: deno test --allow-env _shared/rate-limiter.test.ts

      - name: Install dependencies
        run: |
          cd admin-panel && npm ci --legacy-peer-deps
          cd ../questerix-student-app && flutter pub get
          flutter precache --web

      - name: Check design token sync
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-tokens-freshness.ps1

      - name: Validate Phase 0
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate-phase-0.ps1

      - name: Validate Phase 1
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate-phase-1.ps1

      - name: Validate Phase 2
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate-phase-2.ps1

      - name: Validate Phase 3
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate-phase-3.ps1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-phases-0-3
          path: questerix-cortex/outputs/logs/preflight/*.log

  validate-phase-4-android:
    runs-on: ubuntu-latest
    env:
      STRICT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        run: |
          SDK_MANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          if [ ! -f "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)
          fi
          echo "Using sdkmanager at: $SDK_MANAGER"
          yes | $SDK_MANAGER --licenses
          $SDK_MANAGER "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies
        run: |
          cd questerix-student-app && flutter pub get

      - name: Validate Phase 4
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate-phase-4.ps1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-phase-4
          path: questerix-cortex/outputs/logs/preflight/*.log
