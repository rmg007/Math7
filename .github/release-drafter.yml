name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: "🚨 Breaking Changes"
    labels:
      - "breaking-change"
  - title: "✨ New Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
      - "fix"
  - title: "🔒 Security"
    labels:
      - "security"
  - title: "📚 Documentation"
    labels:
      - "documentation"
  - title: "⚡ Performance"
    labels:
      - "performance"
  - title: "🧹 Maintenance"
    labels:
      - "dependencies"
      - "refactor"
      - "chore"

change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"

version-resolver:
  major:
    labels:
      - "breaking-change"
  minor:
    labels:
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "bug"
      - "fix"
      - "security"
      - "dependencies"
  default: patch

autolabeler:
  - label: "documentation"
    files:
      - "*.md"
      - "docs/**/*"
  - label: "dependencies"
    files:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pubspec.yaml"
      - "**/requirements.txt"
  - label: "ci"
    files:
      - ".github/**/*"
