# Dependabot Configuration
# Automatically creates PRs to update vulnerable dependencies.
# https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # Admin Panel (React/Vite/TypeScript)
  - package-ecosystem: "npm"
    directory: "/admin-panel"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "admin-panel"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Questerix Cortex (Node.js analysis engine + dashboard)
  - package-ecosystem: "npm"
    directory: "/questerix-cortex"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cortex"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Root workspace tooling (dependency-cruiser, supabase CLI, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tooling"

  # GitHub Actions (keeps action SHA pins up to date)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
