name: CI — Student App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      # Install domain package first (local dependency)
      - name: Install domain package deps
        run: flutter pub get
        working-directory: packages/questerix_domain

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test with coverage
        run: flutter test --coverage

      - name: Coverage Gate (60% minimum)
        uses: verygoodopensource/very_good_coverage@f018d9f1b95f137e96b79753e161048b111e1945 # v2.1.0
        with:
          path: "./coverage/lcov.info"
          min_coverage: 60

      - name: Upload Flutter coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
